<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ups... Algo salió mal - Elotito Regio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background-color: #f8f9fa; /* Fondo gris muy suave */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>

    <div class="d-flex align-items-center justify-content-center vh-100">
        <div class="text-center p-5 bg-white shadow-sm rounded-4 m-3" style="max-width: 550px; border-top: 5px solid #FA5252;">
            
            <div class="rounded-circle d-flex justify-content-center align-items-center mx-auto mb-4" 
                 style="width: 90px; height: 90px; background-color: #FFF5F5; color: #FA5252;">
                <i class="bi bi-database-fill-x" style="font-size: 2.5rem;"></i>
            </div>
                <h2 class="fw-bold text-dark mb-3">{{ titulo }}</h2>
            
            <p class="text-muted mb-4 fs-5">
                No hemos podido cargar la sección que buscas. Esto puede deberse a un enlace desactualizado, falta de permisos o un problema temporal en nuestro sistema.
            </p>
            
            <div class="alert alert-light border text-start small text-muted mb-4">
                <i class="bi bi-info-circle-fill text-secondary me-2"></i> 
                <strong>Detalle técnico:</strong> {{ mensaje }}
            </div>

            <a href="/" class="btn btn-warning rounded-pill px-5 py-2 fw-bold shadow-sm text-uppercase text-dark mb-4" style="text-decoration: none; display: inline-block;">
                <i class="bi bi-arrow-clockwise me-2"></i> Volver a intentar
            </a>

            <hr class="opacity-25 mt-2 mb-3">
            <div class="text-center mt-3">
                <p class="text-muted small mb-1">Si el problema persiste, contacta a soporte técnico:</p>
                <a href="mailto:anamarttinezzz@gmail.com" class="fw-bold text-decoration-none" style="color: #F57C00;">
                    <i class="bi bi-envelope-at-fill me-1"></i> anamarttinezzz@gmail.com
                </a>
            </div>
            
        </div>
    </div>

</body>
</html>
