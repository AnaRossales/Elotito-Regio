<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elotito Regio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        body { background-color: #FFFDE7; font-family: 'Open Sans', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid #f0f0f0; }
        h2 { font-family: 'Montserrat', sans-serif; color: #FFA000; font-weight: 700; text-align: center; margin-bottom: 2rem; }
        .form-control { border-radius: 50px; padding: 0.8rem 1.5rem; background-color: #fafafa; border: 1px solid #eee; margin-bottom: 1.5rem; }
        .form-control:focus { box-shadow: none; border-color: #FFA000; background-color: white;}
        .btn-login { background-color: #4CAF50; color: white; border-radius: 50px; padding: 12px; font-weight: 700; width: 100%; transition: 0.3s; border: none; }
        .btn-login:hover { background-color: #388E3C; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Panel de Admin</h2>
        
        {% if error %}
            <div class="alert alert-danger text-center rounded-pill small p-2">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <input type="text" name="usuario" class="form-control" placeholder="Usuario" required autocomplete="off">
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
        
        <div class="text-center mt-4">
            <a href="/" class="text-muted small text-decoration-none">← Volver a la tienda</a>
        </div>
    </div>

</body>
</html>
