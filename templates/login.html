<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elotito Regio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(180deg, #ffffff 0%, #fff9c4 100%); 
            font-family: 'Open Sans', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
        }
        
        .login-card { 
            background: white; 
            padding: 3rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.06); 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid #f9f9f9; 
            text-align: center;
        }
        
        h2 { 
            font-family: 'Montserrat', sans-serif; 
            color: #FFA000; /* Color naranja/elote de tu marca */
            font-weight: 700; 
            margin-bottom: 2rem; 
            font-size: 1.8rem;
        }
        
        .form-control { 
            border-radius: 12px; 
            padding: 0.8rem 1.2rem; 
            background-color: #fcfcfc; 
            border: 1px solid #eee; 
            transition: all 0.3s;
        }
        
        .form-control:focus { 
            box-shadow: 0 0 0 4px rgba(255, 160, 0, 0.15); 
            border-color: #ffca28; 
            background-color: white;
        }

        .password-container { position: relative; margin-top: 1.2rem; margin-bottom: 2rem; }
        .password-container .form-control { padding-right: 3.5rem; } 
        
        .toggle-password { 
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            cursor: pointer; 
            color: #ced4da; 
            transition: 0.2s; 
            font-size: 1.25rem;
            padding: 5px;
        }
        
        .toggle-password:hover { color: #FFA000; }

        .btn-login { 
            background-color: #FFA000; 
            color: white; 
            border-radius: 12px; 
            padding: 12px; 
            font-weight: 700; 
            width: 100%; 
            transition: 0.3s; 
            border: none;
            box-shadow: 0 4px 12px rgba(255, 160, 0, 0.2);
        }
        
        .btn-login:hover { 
            background-color: #FF8F00; 
            transform: translateY(-1px); 
            box-shadow: 0 6px 15px rgba(255, 160, 0, 0.3);
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #adb5bd;
            font-size: 0.85rem;
            text-decoration: none;
            transition: 0.2s;
        }
        .back-link:hover { color: #8e959b; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Inicio de Sesión</h2>
        
        {% if error %}
            <div class="alert alert-danger border-0 small py-2 rounded-3 mb-4" style="background-color: #fff3cd; color: #856404;">
                <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="text-start">
                <label class="small fw-bold text-muted ms-2 mb-1">Usuario</label>
                <input type="text" name="usuario" class="form-control" placeholder="nombre_usuario" required autocomplete="off">
            </div>
            
            <div class="text-start mt-3">
                <label class="small fw-bold text-muted ms-2 mb-1">Contraseña</label>
                <div class="password-container">
                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                    <i class="bi bi-eye-slash toggle-password" id="toggleIcon"></i>
                </div>
            </div>
            
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
        
        <a href="/" class="back-link">← Volver a la página pública</a>
    </div>

    <script>
        const toggleIcon = document.getElementById('toggleIcon');
        const passwordInput = document.getElementById('password');

        toggleIcon.addEventListener('click', function () {
            // Cambia el tipo de input entre password y text
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Alterna los íconos de Bootstrap
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });
    </script>
</body>
</html>
