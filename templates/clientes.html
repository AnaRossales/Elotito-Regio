{% extends "base.html" %}

{% block title %}Clientes - Elotito Regio{% endblock %}

{% block content %}
<h1 class="main-title">Administrar Clientes</h1>

<div class="card-custom shadow-sm mb-5">
    <h5 class="mb-4 fw-bold text-muted text-uppercase">Registrar Nuevo Cliente</h5>
    
    <form action="/guardar_cliente" method="POST">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="small ms-3 fw-bold text-muted mb-1">Nombre(s) *</label>
                <input type="text" name="nombre" class="form-control" required placeholder="Ej. Juan Carlos">
            </div>
            <div class="col-md-4">
                <label class="small ms-3 fw-bold text-muted mb-1">Apellido Paterno *</label>
                <input type="text" name="apellido_paterno" class="form-control" required placeholder="Ej. Pérez">
            </div>
            <div class="col-md-4">
                <label class="small ms-3 fw-bold text-muted mb-1">Apellido Materno</label>
                <input type="text" name="apellido_materno" class="form-control" placeholder="(Opcional)">
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="small ms-3 fw-bold text-muted mb-1">Teléfono</label>
                <input type="tel" name="telefono" class="form-control" placeholder="Ej. 8123456789">
            </div>
            <div class="col-md-6">
                <label class="small ms-3 fw-bold text-muted mb-1">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com">
            </div>
        </div>

        <div class="btn-center-container mt-2">
            <button type="submit" class="btn btn-custom-success btn-lg shadow">
                Guardar Cliente
            </button>
        </div>
    </form>
</div>
{% endblock %}
