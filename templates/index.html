{% extends "base.html" %}

{% block title %}Registro de Clientes{% endblock %}

{% block content %}
    <h1> Registrar Nuevo Cliente</h1>
    <p>Usa este formulario para añadir nuevos clientes al sistema.</p>

    <form action="/guardar_cliente" method="POST">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required style="width: 95%; padding: 8px; margin-top: 5px;">
        
        <label for="telefono" style="margin-top: 10px; display: block;">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" style="width: 95%; padding: 8px; margin-top: 5px;">
        
        <label for="email" style="margin-top: 10px; display: block;">Email:</label>
        <input type="email" id="email" name="email" style="width: 95%; padding: 8px; margin-top: 5px;">
        
        <label for="direccion" style="margin-top: 10px; display: block;">Dirección:</label>
        <input type="text" id="direccion" name="direccion" style="width: 95%; padding: 8px; margin-top: 5px;">
        
        <button type="submit" style="margin-top: 20px; padding: 12px; background-color: #FFC107; font-size: 16px; border: none; cursor: pointer;">Guardar Cliente</button>
    </form>
{% endblock %}
