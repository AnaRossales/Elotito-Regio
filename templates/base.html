<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Elotito Regio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        :root {
            --elote-gold: #FFC107;
            --elote-orange: #FFA000;
            --elote-green: #4CAF50; 
            --bg-body: #ffffff; 
            --text-dark: #3E2723;
        }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--bg-body); color: var(--text-dark); }
        h1, h2, h3, h4, h5, h6, .navbar-brand { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--text-dark); }
        .main-title { text-align: center; color: var(--elote-green) !important; margin-top: 3rem; margin-bottom: 2.5rem; position: relative; display: inline-block; left: 50%; transform: translateX(-50%); }
        .main-title::after { content: ''; display: block; width: 80%; height: 6px; background-color: var(--elote-orange); margin: 10px auto 0; border-radius: 5px; }
        .navbar-main { background-color: white !important; box-shadow: 0 4px 15px rgba(0,0,0,0.06); padding: 1rem 0; }
        .navbar-brand { font-weight: 700; color: var(--elote-gold) !important; text-transform: uppercase; }
        .nav-link { color: var(--text-dark) !important; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; padding: 1rem !important; }
        .nav-link:hover { color: var(--elote-orange) !important; }
        .card-custom { background-color: white; border: 1px solid #f0f0f0; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 2rem; max-width: 800px; margin-left: auto; margin-right: auto; padding: 2.5rem; }
        .form-label-custom { font-weight: 700; color: #555; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 0.5rem; margin-left: 1rem; }
        .form-control, .form-select { border-radius: 50px !important; border: 1px solid #DDD; padding: 0.75rem 1.5rem; height: calc(1.5em + 1.5rem + 2px); }
        .form-control:focus, .form-select:focus { border-color: var(--elote-gold); box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.2); }
        .form-group-flex { display: flex; gap: 1rem; align-items: center; }
        .form-group-flex .form-select { flex-grow: 1; }
        .btn-custom-orange { background-color: var(--elote-orange); color: white; border: none; border-radius: 50px; font-weight: 600; padding: 0.75rem 1.5rem; height: calc(1.5em + 1.5rem + 2px); display: flex; align-items: center; justify-content: center; transition: all 0.2s; white-space: nowrap; text-decoration: none;}
        .btn-custom-orange:hover { background-color: #E68A00; transform: translateY(-2px); color: white; }
        .btn-custom-success { background-color: var(--elote-green); color: white; border: none; border-radius: 50px; font-weight: 600; padding: 10px 30px; transition: all 0.2s; }
        .btn-custom-success:hover { background-color: #388E3C; transform: translateY(-2px); color: white; }
        .btn-center-container { text-align: center; margin-top: 3rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light navbar-main">
    <div class="container">
        <a class="navbar-brand" href="/admin">Panel Admin</a>
        <div class="collapse navbar-collapse justify-content-end">
            <div class="navbar-nav align-items-center">
                <a class="nav-link" href="/admin">Dashboard</a>
                <a class="nav-link" href="/registrar_evento">Registrar Venta</a>
                <a class="nav-link" href="/eventos_lista">Historial</a>
                <a class="nav-link" href="/clientes">Clientes</a>
                <a class="nav-link" href="/paquetes">Paquetes</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm rounded-pill ms-3 fw-bold">Cerrar Sesión</a>
            </div>
        </div>
    </div>
</nav>
    <div class="container my-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
